name: Release macOS App

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.0.0)'
        required: false

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # SwiftSoup 2.13.4 (pinned in Package.resolved) declares swift-tools-version:6.0,
          # which requires an Xcode 16+ toolchain to even parse its manifest. The runner's
          # default /Applications/Xcode.app symlink can lag behind the newest Xcode actually
          # installed alongside it, so select the highest installed version explicitly.
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "${LATEST_XCODE:-/Applications/Xcode.app}"
          xcodebuild -version

      - name: Check version.env matches the release tag
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          source ./version.env
          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" != "v${VERSION}" ]]; then
            echo "Release tag ($TAG) does not match version.env VERSION (v${VERSION})." >&2
            echo "Bump VERSION (and BUILD) in version.env before tagging the release." >&2
            exit 1
          fi
          echo "✅ version.env matches tag: $TAG"

      - name: Import Developer ID certificate (required for notarized releases)
        if: github.event_name == 'release'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERT_P12_BASE64}" || -z "${MACOS_CERT_PASSWORD}" ]]; then
            echo "Missing secrets: MACOS_CERT_P12_BASE64 and/or MACOS_CERT_PASSWORD" >&2
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/codesign.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/codesign.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/codesign.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build release
        run: |
          # build.sh drives the full packaging (universal binary + app bundle).
          # It ad-hoc signs only; the Developer ID signature and notarization are
          # applied in the dedicated step below on release events.
          ./build.sh

      - name: Verify app bundle
        run: |
          ./scripts/verify_app_bundle.sh

      - name: Sign, notarize, and staple
        if: github.event_name == 'release'
        env:
          APP_IDENTITY: ${{ secrets.APP_IDENTITY }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_IDENTITY}" ]]; then
            echo "Missing secret: APP_IDENTITY" >&2
            exit 1
          fi
          if [[ -z "${APP_STORE_CONNECT_API_KEY_P8}" || -z "${APP_STORE_CONNECT_KEY_ID}" || -z "${APP_STORE_CONNECT_ISSUER_ID}" ]]; then
            echo "Missing App Store Connect notarization secrets:" >&2
            echo "  APP_STORE_CONNECT_API_KEY_P8 / APP_STORE_CONNECT_KEY_ID / APP_STORE_CONNECT_ISSUER_ID" >&2
            exit 1
          fi
          # sign_and_notarize.sh signs Sparkle's nested helpers inside-out, signs
          # the app with the Developer ID identity, then notarizes and staples the
          # ticket into the bundle — so the zip created below ships stapled.
          ./scripts/sign_and_notarize.sh

      - name: Package app bundle
        id: package
        run: |
          set -euo pipefail

          # Determine version tag
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="dev-$(date +%Y%m%d-%H%M%S)"
          fi

          echo "Building version: $TAG"

          # Create zip
          ASSET="CopyCopy-${TAG}-macos.zip"
          ditto --norsrc -c -k --keepParent "dist/CopyCopy.app" "$ASSET"

          # Create checksum
          shasum -a 256 "$ASSET" > "$ASSET.sha256"

          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET="${{ steps.package.outputs.asset }}"
          TAG="${{ github.event.release.tag_name }}"
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber

      # Publish the Sparkle appcast BEFORE the Homebrew cask. The appcast is the
      # in-app auto-update mechanism and is the more important of the two publish
      # steps; ordering it first means a failure in the cask step (e.g. a missing
      # or under-scoped HOMEBREW_TAP_TOKEN) can no longer skip auto-update delivery.
      - name: Publish Sparkle appcast
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PRIVATE_KEY}" ]]; then
            echo "Missing secret: SPARKLE_PRIVATE_KEY" >&2
            exit 1
          fi

          source ./version.env
          TAG="${{ github.event.release.tag_name }}"
          ASSET="${{ steps.package.outputs.asset }}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ASSET}"
          NOTES_URL="${{ github.event.release.html_url }}"
          PUBDATE="$(date -u '+%a, %d %b %Y %H:%M:%S +0000')"

          # EdDSA-sign the zip → "sparkle:edSignature=\"...\" length=\"...\""
          SIGN_UPDATE="$(find .build -path '*Sparkle/bin/sign_update' | head -1)"
          [[ -x "$SIGN_UPDATE" ]] || { echo "sign_update tool not found under .build" >&2; exit 1; }
          KEYF="$RUNNER_TEMP/sparkle_ed_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEYF"
          SIG_ATTRS="$("$SIGN_UPDATE" --ed-key-file "$KEYF" "$ASSET")"
          rm -f "$KEYF"

          ITEM_FILE="$RUNNER_TEMP/appcast-item.xml"
          printf '    <item>\n      <title>%s</title>\n      <link>%s</link>\n      <sparkle:version>%s</sparkle:version>\n      <sparkle:shortVersionString>%s</sparkle:shortVersionString>\n      <sparkle:minimumSystemVersion>%s</sparkle:minimumSystemVersion>\n      <pubDate>%s</pubDate>\n      <enclosure url="%s" %s type="application/octet-stream" />\n    </item>\n' \
            "$VERSION" "$NOTES_URL" "$BUILD" "$VERSION" "$MIN_SYSTEM_VERSION" "$PUBDATE" "$URL" "$SIG_ATTRS" > "$ITEM_FILE"

          # Update docs/appcast.xml on the default branch (served at copycopy.app via Pages).
          REPO_DIR="$RUNNER_TEMP/copycopy-pages"
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "$REPO_DIR"
          cd "$REPO_DIR"

          if grep -q "<sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>" docs/appcast.xml; then
            echo "Appcast already lists ${VERSION}."
            exit 0
          fi

          awk -v f="$ITEM_FILE" '/<!-- RELEASE_ITEMS -->/{print; while((getline line < f)>0) print line; close(f); next} {print}' \
            docs/appcast.xml > docs/appcast.xml.new
          mv docs/appcast.xml.new docs/appcast.xml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          git commit -m "appcast: CopyCopy ${VERSION}"
          git push origin HEAD:main

      - name: Update Homebrew cask
        if: github.event_name == 'release'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "Missing secret: HOMEBREW_TAP_TOKEN" >&2
            exit 1
          fi

          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          ASSET="${{ steps.package.outputs.asset }}"
          SHA256="$(shasum -a 256 "$ASSET" | awk '{print $1}')"
          export VERSION SHA256
          TAP_DIR="$RUNNER_TEMP/homebrew-copycopy"

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/mpuig/homebrew-copycopy.git" "$TAP_DIR"
          cd "$TAP_DIR"

          ruby -0pi -e 'gsub(/version "[^"]+"/, "version \"#{ENV.fetch("VERSION")}\""); gsub(/sha256 "[0-9a-f]+"/, "sha256 \"#{ENV.fetch("SHA256")}\"")' Casks/copycopy.rb

          if git diff --quiet; then
            echo "Homebrew cask already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/copycopy.rb
          git commit -m "copycopy ${VERSION}"
          git push origin main

      - name: Upload workflow artifact (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: CopyCopy-macos
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
